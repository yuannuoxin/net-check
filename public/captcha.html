  <link rel="canonical" href="/captcha">
  <link rel="stylesheet" href="/src/style.css">

<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>Net Check</h1>

    <div class="panel-head">
