<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebRTC 泄露检测 · 真实 IP 暴露检查 | Net Check</title>
  <meta name="description" content="通过多个 STUN 服务器收集 ICE 候选地址，检查 WebRTC 是否绕过代理暴露真实 IP。代理模式下 UDP 可能发不出去，建议在 TUN 模式下复测。">
  <link rel="canonical" href="/webrtc">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>Net Check</h1>
      <span class="brand-sub">网络自检工具箱</span>
    </div>
    <nav class="tabs" aria-label="主导航">
      <a class="tab" href="/">出口概览</a>
      <a class="tab" href="/connectivity">连通性</a>
      <a class="tab" href="/dns">DNS 泄露</a>
      <a class="tab active" href="/webrtc">WebRTC</a>
      <a class="tab" href="/captcha">验证码</a>
    </nav>
  </header>

  <main class="container">
    <div class="panel-head">
      <div>
        <h2>WebRTC 泄露检测</h2>
        <p class="muted">通过多个 STUN 服务器收集 ICE 候选地址，检查是否绕过代理暴露真实 IP。代理模式下 UDP 可能发不出去，建议在 TUN 模式下复测。</p>
      </div>
      <button id="rtcBtn" class="btn">开始检测</button>
    </div>
    <div id="rtcExit" class="muted"></div>
    <div id="rtcVerdict" class="verdict-area"></div>
    <div id="rtcStatus" class="muted"></div>
    <table class="grid-table" id="rtcTable" hidden>
      <thead><tr><th>#</th><th>IP 地址</th><th>类型</th><th>归属地</th><th>状态</th></tr></thead>
      <tbody id="rtcBody"></tbody>
    </table>
  </main>

  <footer class="footer muted">
    纯前端直连第三方公开接口 · 不记录、不存储检测结果 · 风险判定来自第三方库，仅供参考
  </footer>

  <script type="module" src="/src/boot-webrtc.js"></script>
</body>
</html>
